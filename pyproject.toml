[project]
name = "Django-Logic-Demo"
version = "0.0.1"
description = ""
authors = [
    { name = "Emil", email = "emil@borderless360.com" },
    { name = "Andrey", email = "andrey@borderless360.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[pytest] == 5.5.3",
    "clickhouse-connect ~=0.9.2",
    "Django == 5.2.8",
    "django-logic == 0.1.6",
    "django-logic-celery == 0.0.9",
    "django-model-utils == 5.0.0",
    "django-environ == 0.12.0",
    "django-extensions == 4.1",
    "psycopg2-binary == 2.9.11",
    "redis == 7.1.0",
    "requests ~=2.32.0",
]

[dependency-groups]
dev = [
    "pudb            ~=2024.1.2", # Full-screen console debugger for Python
    "granian[reload] ~=2.4.2"   , # Granian is a Rust HTTP server for Python applications built on top of Hyper and Tokio.
    "ruff            ~=0.12.7"  , # Ruff is a fast, opinionated, and configurable Python linter.
    "pytest          ~=9.0.2"   , # pytest is a testing framework for Python.
    "pytest-django   ~=4.11.1"  , # pytest-django is a plugin for pytest that provides a Django test runner and a Django test client.
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-p", "celery.contrib.pytest"]
testpaths = [
    "abstract/e2e",
    "locker/e2e",
    "invoice/e2e",
    "autofixer/tests",
]
python_files = ["test_*.py", ]
DJANGO_SETTINGS_MODULE = "demo.settings"
# Use existing database for e2e tests instead of creating a test database
# DJANGO_DB_NAME_AS_SUFFIX = false
